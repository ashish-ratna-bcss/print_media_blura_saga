[pytest]
testpaths = tests
# conftest.py is imported directly by the test modules (for `needs_mongo`),
# so its directory has to be importable rather than only auto-loaded.
pythonpath = . tests
addopts = -q --strict-markers
filterwarnings =
    # Third-party deprecations we do not control: starlette's testclient
    # advising httpx2, and thop's distutils use reached through torch.
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
